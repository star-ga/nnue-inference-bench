name: GPU Benchmark (self-hosted)

# Manual only: needs a self-hosted runner with an NVIDIA GPU, a CUDA toolkit
# and (for the MIND row) a mindc built from star-ga/mind main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-benchmark:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v7
      - name: Install NumPy
        run: python3 -m pip install --upgrade numpy
      - name: Build C++ and CUDA
        run: |
          cmake -S native-cpp -B native-cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native-cpp/build --config Release
          cmake -S native-cuda -B native-cuda/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native-cuda/build --config Release
      - name: Run and verify
        run: python3 tools/run_benchmark.py --require python,cpp,simd,cuda -o build/work/gpu.json
      - name: Validate against pinned checksum
        run: python3 tools/validate_results.py build/work/gpu.json
      - uses: actions/upload-artifact@v7
        with:
          name: gpu-benchmark-results
          path: build/work/gpu.json
